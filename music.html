<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horizons - Song Player</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 5px 0; color: #38bdf8; font-size: 1.8rem; }
        .artist { margin: 0 0 25px 0; color: #94a3b8; font-size: 0.95rem; letter-spacing: 1px; }

        .lyrics-box {
            height: 160px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lyric-line {
            font-size: 1.2rem;
            font-weight: 600;
            color: #475569;
            transition: all 0.3s ease;
            position: absolute;
            opacity: 0;
            transform: translateY(20px);
            width: 100%;
        }

        .lyric-line.active {
            opacity: 1;
            color: #f43f5e;
            transform: translateY(0);
            text-shadow: 0 0 15px rgba(244,63,94,0.6);
        }

        .btn-play {
            background: #f43f5e;
            border: none;
            color: white;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244,63,94,0.4);
            transition: all 0.2s;
        }

        .btn-play:hover {
            background: #fda4af;
            color: #0f172a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Neon Horizons</h2>
        <div class="artist">SYNTHWAVE AI</div>

        <div class="lyrics-box">
            <div class="lyric-line active" id="line0">Press Play to begin the journey...</div>
            <div class="lyric-line" id="line1">⚡ I step into the cold night air ⚡</div>
            <div class="lyric-line" id="line2">✨ Neon static glowing everywhere ✨</div>
            <div class="lyric-line" id="line3">🚗 Drifting past the edge of time 🚗</div>
            <div class="lyric-line" id="line4">🎵 Chasing echoes of a simple rhyme 🎵</div>
            <div class="lyric-line" id="line5">🌌 Oh, horizons calling out my name... 🌌</div>
        </div>

        <button class="btn-play" id="playBtn" onclick="togglePlayback()">🎵 Play Song</button>
    </div>

    <script>
        let isPlaying = false;
        let audioCtx = null;
        let currentLine = 0;
        let lyricTimer = null;
        let audioTimer = null;

        // Millisecond delays between lyric lines
        const intervals =; 

        function togglePlayback() {
            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('playBtn').textContent = "⏹️ Stop Song";
                currentLine = 0;
                
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                advanceLyrics();
                playSynthLoop();
            } else {
                stopPlayback();
            }
        }

        function stopPlayback() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = "🎵 Play Song";
            clearTimeout(lyricTimer);
            clearTimeout(audioTimer);
            
            document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
            document.getElementById('line0').classList.add('active');
        }

        function advanceLyrics() {
            if (!isPlaying) return;

            document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
            currentLine++;

            if (currentLine <= 5) {
                document.getElementById(`line${currentLine}`).classList.add('active');
                lyricTimer = setTimeout(advanceLyrics, intervals[currentLine - 1]);
            } else {
                stopPlayback();
            }
        }

        function playSynthLoop() {
            if (!isPlaying) return;

            const chords = [130.81, 146.83, 164.81, 196.00]; 
            let currentNote = chords[Math.floor(Math.random() * chords.length)];

            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(currentNote, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.7);

            audioTimer = setTimeout(playSynthLoop, 500);
        }
    </script>
</body>
</html>
